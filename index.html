<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTP Key System</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body {
    min-height:100vh;
    background: #023e8a;
    background: linear-gradient(135deg, #03045e 0%, #023e8a 50%, #0077b6 100%);
    display:flex; justify-content:center; align-items:center;
    padding:20px;
  }

  .container {
    background: #ffffff;
    border-radius: 18px;
    padding: 35px 28px;
    width: 100%; max-width: 420px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.2);
  }

  h1 {
    text-align:center;
    color:#023e8a;
    margin-bottom:8px;
    font-size:24px;
    font-weight:700;
  }
  .subtitle {
    text-align:center;
    color:#0077b6;
    font-size:13px;
    margin-bottom:25px;
  }

  input {
    width:100%;
    padding:14px 16px;
    margin-bottom:12px;
    border:2px solid #caf0f8;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:0.25s;
    background:#f8fdff;
    color:#03045e;
  }
  input::placeholder { color:#90a8c0; }
  input:focus {
    border-color:#0077b6;
    background:#fff;
    box-shadow:0 0 0 4px rgba(0,119,182,0.15);
  }

  button {
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#0077b6;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.25s;
    margin-bottom:10px;
  }
  button:hover { background:#023e8a; transform:translateY(-1px); }
  button:active { transform:translateY(0); }

  .admin-link {
    text-align:center;
    font-size:12px;
    color:#90a8c0;
    cursor:pointer;
    margin-top:15px;
    user-select:none;
    transition:0.25s;
  }
  .admin-link:hover { color:#0077b6; }

  .hidden { display:none !important; }

  .message {
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-size:14px;
    margin-bottom:15px;
    font-weight:500;
  }
  .error { background:#ffe0e0; color:#c00; }
  .success { background:#d4f8d4; color:#060; }

  #adminPanel { max-width: 560px; }

  .key-options {
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:8px;
    margin-bottom:20px;
  }
  .key-options button {
    margin:0;
    padding:12px;
    font-size:14px;
    background:#0096c7;
  }
  .key-options button:hover { background:#0077b6; }
  .btn-perm {
    background:#03045e !important;
    grid-column: span 2;
  }
  .btn-perm:hover { background:#023e8a !important; }

  .key-item {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    background:#f0f9ff;
    border-radius:10px;
    margin-bottom:8px;
    border-left:4px solid #0077b6;
    cursor:pointer;
    transition:0.2s;
    font-size:13px;
  }
  .key-item:hover {
    background:#e0f2fe;
    transform:translateX(3px);
  }
  .key-code {
    font-family:'Courier New',monospace;
    font-weight:700;
    color:#023e8a;
    font-size:14px;
  }
  .key-badge {
    background:#0077b6;
    color:#fff;
    padding:3px 10px;
    border-radius:20px;
    font-size:11px;
    margin-left:8px;
    white-space:nowrap;
  }
  .copy-hint {
    font-size:11px;
    color:#888;
    margin-top:15px;
    text-align:center;
  }
  .section-title {
    color:#023e8a;
    font-size:15px;
    margin:20px 0 10px;
    font-weight:700;
  }
  .back-btn {
    background:#90a8c0 !important;
    color:#fff !important;
  }
  .back-btn:hover { background:#6b8299 !important; }

  .toast {
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:#023e8a;
    color:#fff;
    padding:12px 24px;
    border-radius:30px;
    font-size:14px;
    z-index:999;
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
    animation: slideDown 0.3s ease;
  }
  @keyframes slideDown {
    from { opacity:0; top:-50px; }
    to { opacity:1; top:20px; }
  }

  .key-info {
    font-size:11px;
    color:#666;
    margin-top:3px;
  }
</style>
</head>
<body>

<!-- ============ MÀN HÌNH CHÍNH ============ -->
<div class="container" id="mainBox">
  <h1>🌊 MTP Key System</h1>
  <p class="subtitle">Nhập key để sử dụng</p>

  <div id="msgBox"></div>

  <input type="text" id="keyInput" placeholder="Nhập key của bạn...">
  <button onclick="checkKey()">🔓 Xác Nhận Key</button>

  <div class="admin-link" onclick="showAdminLogin()">⚙️ admin</div>
</div>

<!-- ============ ADMIN LOGIN ============ -->
<div class="container hidden" id="adminLogin">
  <h1>🔐 Admin Login</h1>
  <p class="subtitle">Chỉ dành cho quản trị viên</p>
  <div id="adminMsgBox"></div>

  <input type="text" id="adminUser" placeholder="Tên đăng nhập">
  <input type="password" id="adminPass" placeholder="Mật khẩu">
  <button onclick="adminLogin()">Đăng Nhập</button>
  <button class="back-btn" onclick="showMain()">← Quay lại</button>
</div>

<!-- ============ ADMIN PANEL ============ -->
<div class="container hidden" id="adminPanel">
  <h1>👑 Bảng Điều Khiển</h1>
  <p class="subtitle">Xin chào, <b id="adminName"></b></p>

  <div class="section-title">🎫 Tạo Key Mới</div>
  <div class="key-options">
    <button onclick="createKey('1h')">⏱️ 1 Giờ</button>
    <button onclick="createKey('10h')">⏱️ 10 Giờ</button>
    <button onclick="createKey('1d')">📅 1 Ngày</button>
    <button onclick="createKey('3d')">📅 3 Ngày</button>
    <button onclick="createKey('7d')">📅 7 Ngày</button>
    <button onclick="createKey('30d')">📅 30 Ngày</button>
    <button onclick="createKey('60d')">📅 60 Ngày</button>
    <button class="btn-perm" onclick="createKey('perm')">♾️ Vĩnh Viễn</button>
  </div>

  <div class="section-title">📋 Danh Sách Key</div>
  <div id="keyList"></div>
  <p class="copy-hint">💡 Click vào key để sao chép</p>

  <button class="back-btn" style="margin-top:20px;" onclick="logout()">Đăng Xuất</button>
</div>

<script>
// ==================== CẤU HÌNH ADMIN ====================
const ADMIN_USER = "MTP";
const ADMIN_PASS = "MTP313";

// ==================== DỮ LIỆU ====================
let validKeys = JSON.parse(localStorage.getItem('mtp_keys') || '[]');
let usedKeys  = JSON.parse(localStorage.getItem('mtp_used') || '[]');

// ==================== CHUYỂN MÀN HÌNH ====================
function showMain() {
  document.getElementById('mainBox').classList.remove('hidden');
  document.getElementById('adminLogin').classList.add('hidden');
  document.getElementById('adminPanel').classList.add('hidden');
}
function showAdminLogin() {
  document.getElementById('mainBox').classList.add('hidden');
  document.getElementById('adminLogin').classList.remove('hidden');
  document.getElementById('adminPanel').classList.add('hidden');
}
function showAdminPanel() {
  document.getElementById('mainBox').classList.add('hidden');
  document.getElementById('adminLogin').classList.add('hidden');
  document.getElementById('adminPanel').classList.remove('hidden');
  document.getElementById('adminName').textContent = ADMIN_USER;
  renderKeys();
}

// ==================== THÔNG BÁO ====================
function showMsg(boxId, text, type) {
  const box = document.getElementById(boxId);
  box.innerHTML = '<div class="message ' + type + '">' + text + '</div>';
  setTimeout(function(){ box.innerHTML = ''; }, 3000);
}
function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2000);
}

// ==================== TẠO KEY ====================
function randomStr(len) {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let r = '';
  for (let i = 0; i < len; i++) r += chars[Math.floor(Math.random() * chars.length)];
  return r;
}

function createKey(duration) {
  const key = 'MTP-' + duration + 'x-' + randomStr(4);
  const created = Date.now();
  let expire = null;

  if (duration !== 'perm') {
    const ms = {
      '1h': 3600000,
      '10h': 36000000,
      '1d': 86400000,
      '3d': 259200000,
      '7d': 604800000,
      '30d': 2592000000,
      '60d': 5184000000
    }[duration];
    expire = created + ms;
  }

  validKeys.push({ key: key, duration: duration, created: created, expire: expire });
  saveKeys();
  renderKeys();
  toast('✅ Đã tạo: ' + key);
}

function saveKeys() {
  localStorage.setItem('mtp_keys', JSON.stringify(validKeys));
  localStorage.setItem('mtp_used', JSON.stringify(usedKeys));
}

// ==================== HIỂN THỊ KEY ====================
function renderKeys() {
  const list = document.getElementById('keyList');
  if (validKeys.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:#999;font-size:13px;">Chưa có key nào</p>';
    return;
  }
  list.innerHTML = validKeys.map(function(k) {
    const expired = k.expire && Date.now() > k.expire;
    const used = usedKeys.indexOf(k.key) !== -1;
    const status = expired ? '❌ Hết hạn' : (used ? '✅ Đã dùng' : '🟢 Hoạt động');
    return '<div class="key-item" onclick="copyKey(\'' + k.key + '\')">' +
      '<div>' +
        '<div class="key-code">' + k.key + '</div>' +
        '<div class="key-info">' + status + '</div>' +
      '</div>' +
      '<span class="key-badge">' + k.duration + '</span>' +
    '</div>';
  }).join('');
}

// ==================== COPY KEY ====================
function copyKey(key) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(key).then(function() {
      toast('📋 Đã sao chép: ' + key);
    }).catch(function() { fallbackCopy(key); });
  } else {
    fallbackCopy(key);
  }
}
function fallbackCopy(key) {
  const ta = document.createElement('textarea');
  ta.value = key;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('📋 Đã sao chép: ' + key); }
  catch(e) { alert('Key: ' + key); }
  ta.remove();
}

// ==================== KIỂM TRA KEY ====================
function checkKey() {
  const input = document.getElementById('keyInput').value.trim();
  if (!input) {
    showMsg('msgBox', '⚠️ Vui lòng nhập key!', 'error');
    return;
  }

  const found = validKeys.find(function(k){ return k.key === input; });
  if (!found) {
    showMsg('msgBox', '❌ Key không hợp lệ!', 'error');
    return;
  }
  if (usedKeys.indexOf(input) !== -1) {
    showMsg('msgBox', '❌ Key đã được sử dụng!', 'error');
    return;
  }
  if (found.expire && Date.now() > found.expire) {
    showMsg('msgBox', '❌ Key đã hết hạn!', 'error');
    return;
  }

  usedKeys.push(input);
  saveKeys();
  showMsg('msgBox', '✅ Xác nhận thành công!', 'success');
  setTimeout(function() {
    alert('🌊 Chào mừng!\n\nKey: ' + input + '\nHạn: ' + (found.duration === 'perm' ? 'Vĩnh viễn' : found.duration));
  }, 600);
}

// ==================== ADMIN ====================
function adminLogin() {
  const u = document.getElementById('adminUser').value.trim();
  const p = document.getElementById('adminPass').value.trim();
  if (u === ADMIN_USER && p === ADMIN_PASS) {
    showAdminPanel();
  } else {
    showMsg('adminMsgBox', '❌ Sai tên hoặc mật khẩu!', 'error');
  }
}

function logout() {
  document.getElementById('adminUser').value = '';
  document.getElementById('adminPass').value = '';
  showMain();
  toast('👋 Đã đăng xuất');
}

// ==================== ENTER ĐỂ SUBMIT ====================
document.getElementById('keyInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') checkKey();
});
document.getElementById('adminPass').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') adminLogin();
});
</script>
</body>
</html>
